    declaracion: "Creemos en la arquitectura que envejece bien: luz, proporción y materiales que mejoran con el uso."
    texto: |
      Albar nace en 2012 en Zaragoza. Somos un estudio pequeño a propósito: cada proyecto lo llevan las mismas dos personas de principio a fin.

      Acompañamos la obra semana a semana y trabajamos con oficios locales de confianza.
