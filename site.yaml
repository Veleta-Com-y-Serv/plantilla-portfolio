      - { pregunta: "¿Cuánto cuesta un proyecto?", respuesta: "Depende del tamaño y del tipo de encargo. Tras la primera reunión te enviamos una propuesta de honorarios cerrada y por fases." }
      - { pregunta: "¿Os encargáis de la licencia de obras?", respuesta: "Sí. Redactamos el proyecto, lo presentamos en el ayuntamiento y te avisamos de cada paso hasta tener la licencia." }
      - { pregunta: "¿Hacéis también la dirección de obra?", respuesta: "Sí. Visitamos la obra cada semana, revisamos certificaciones y resolvemos los detalles con la constructora." }
